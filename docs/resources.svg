<svg xmlns="http://www.w3.org/2000/svg" width="800" height="798" viewBox="0 0 800 798" font-family="Segoe UI, system-ui, -apple-system, sans-serif" role="img" aria-label="Resource use chart">
<rect width="100%" height="100%" rx="8" fill="#fbfaf7"/>
<text x="24" y="38" font-size="20" font-weight="700" fill="#1d1d1b">Resource use</text>
<text x="24" y="60" font-size="13" fill="#6b6a66">The newest Wordwarden release against the newest Harper extension and the newest LanguageTool server, on the same machine. Shorter is better.</text>
<line x1="24" y1="80" x2="776" y2="80" stroke="#e4e2dc"/>
<text x="258" y="126" font-size="14" font-weight="600" fill="#1d1d1b" text-anchor="end">Memory while checking, 1 tab</text>
<rect x="272" y="104" width="44.2" height="16" rx="2" fill="#1e6fd9"/>
<text x="322.2" y="116.5" font-size="12" font-weight="600" fill="#1d1d1b">134 MB <tspan font-weight="400" fill="#6b6a66">8.5× less than LanguageTool</tspan></text>
<rect x="272" y="124" width="75.9" height="16" rx="2" fill="#2a9d8f"/>
<text x="353.9" y="136.5" font-size="12" font-weight="600" fill="#1d1d1b">230 MB</text>
