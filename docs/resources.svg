<svg xmlns="http://www.w3.org/2000/svg" width="800" height="798" viewBox="0 0 800 798" font-family="Segoe UI, system-ui, -apple-system, sans-serif" role="img" aria-label="Resource use chart">
<rect width="100%" height="100%" rx="8" fill="#fbfaf7"/>
