<text x="656.0" y="336.5" font-size="12" font-weight="600" fill="#1d1d1b">21 s</text>
<text x="258" y="396" font-size="14" font-weight="600" fill="#1d1d1b" text-anchor="end">CPU time per check</text>
<rect x="272" y="374" width="31.2" height="16" rx="2" fill="#1e6fd9"/>
<text x="309.2" y="386.5" font-size="12" font-weight="600" fill="#1d1d1b">53 ms <tspan font-weight="400" fill="#6b6a66">12× less than LanguageTool</tspan></text>
