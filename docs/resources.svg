<text x="656.0" y="516.5" font-size="12" font-weight="600" fill="#1d1d1b">386 MB + Java</text>
<text x="258" y="576" font-size="14" font-weight="600" fill="#1d1d1b" text-anchor="end">Time to check 528 words</text>
