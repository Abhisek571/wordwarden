<text x="656.0" y="156.5" font-size="12" font-weight="600" fill="#1d1d1b">704 MB</text>
<text x="258" y="216" font-size="14" font-weight="600" fill="#1d1d1b" text-anchor="end">Memory while checking, 20 tabs</text>
<rect x="272" y="194" width="106.1" height="16" rx="2" fill="#1e6fd9"/>
<text x="384.1" y="206.5" font-size="12" font-weight="600" fill="#1d1d1b">198 MB <tspan font-weight="400" fill="#6b6a66">3.6× less than LanguageTool</tspan></text>
<rect x="272" y="214" width="228.9" height="16" rx="2" fill="#2a9d8f"/>
<text x="506.9" y="226.5" font-size="12" font-weight="600" fill="#1d1d1b">426 MB</text>
<rect x="272" y="234" width="378.0" height="16" rx="2" fill="#9a9893"/>
<text x="656.0" y="246.5" font-size="12" font-weight="600" fill="#1d1d1b">704 MB</text>
<text x="258" y="306" font-size="14" font-weight="600" fill="#1d1d1b" text-anchor="end">CPU time to start</text>
<rect x="272" y="284" width="52.4" height="16" rx="2" fill="#1e6fd9"/>
<text x="330.4" y="296.5" font-size="12" font-weight="600" fill="#1d1d1b">1.7 s <tspan font-weight="400" fill="#6b6a66">7.2× less than LanguageTool</tspan></text>
<rect x="272" y="304" width="90.2" height="16" rx="2" fill="#2a9d8f"/>
<text x="368.2" y="316.5" font-size="12" font-weight="600" fill="#1d1d1b">3 s</text>
<rect x="272" y="324" width="378.0" height="16" rx="2" fill="#9a9893"/>
<text x="656.0" y="336.5" font-size="12" font-weight="600" fill="#1d1d1b">13 s</text>
<text x="258" y="396" font-size="14" font-weight="600" fill="#1d1d1b" text-anchor="end">CPU time per check</text>
<rect x="272" y="374" width="43.2" height="16" rx="2" fill="#1e6fd9"/>
<text x="321.2" y="386.5" font-size="12" font-weight="600" fill="#1d1d1b">42 ms <tspan font-weight="400" fill="#6b6a66">8.7× less than LanguageTool</tspan></text>
<rect x="272" y="394" width="180.8" height="16" rx="2" fill="#2a9d8f"/>
<text x="458.8" y="406.5" font-size="12" font-weight="600" fill="#1d1d1b">177 ms</text>
<rect x="272" y="414" width="378.0" height="16" rx="2" fill="#9a9893"/>
<text x="656.0" y="426.5" font-size="12" font-weight="600" fill="#1d1d1b">370 ms</text>
<text x="258" y="486" font-size="14" font-weight="600" fill="#1d1d1b" text-anchor="end">Size on disk</text>
<rect x="272" y="464" width="14.0" height="16" rx="2" fill="#1e6fd9"/>
<text x="292.0" y="476.5" font-size="12" font-weight="600" fill="#1d1d1b">14 MB <tspan font-weight="400" fill="#6b6a66">27× smaller than LanguageTool</tspan></text>
<rect x="272" y="484" width="19.3" height="16" rx="2" fill="#2a9d8f"/>
<text x="297.3" y="496.5" font-size="12" font-weight="600" fill="#1d1d1b">20 MB</text>
