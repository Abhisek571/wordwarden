<text x="656.0" y="156.5" font-size="12" font-weight="600" fill="#1d1d1b">1,148 MB</text>
<text x="258" y="216" font-size="14" font-weight="600" fill="#1d1d1b" text-anchor="end">Memory while checking, 20 tabs</text>
<rect x="272" y="194" width="63.2" height="16" rx="2" fill="#1e6fd9"/>
<text x="341.2" y="206.5" font-size="12" font-weight="600" fill="#1d1d1b">192 MB <tspan font-weight="400" fill="#6b6a66">6× less than LanguageTool</tspan></text>
<rect x="272" y="214" width="154.6" height="16" rx="2" fill="#2a9d8f"/>
<text x="432.6" y="226.5" font-size="12" font-weight="600" fill="#1d1d1b">470 MB</text>
<rect x="272" y="234" width="378.0" height="16" rx="2" fill="#9a9893"/>
<text x="656.0" y="246.5" font-size="12" font-weight="600" fill="#1d1d1b">1,148 MB</text>
<text x="258" y="306" font-size="14" font-weight="600" fill="#1d1d1b" text-anchor="end">CPU time to start</text>
<rect x="272" y="284" width="41.5" height="16" rx="2" fill="#1e6fd9"/>
<text x="319.5" y="296.5" font-size="12" font-weight="600" fill="#1d1d1b">2 s <tspan font-weight="400" fill="#6b6a66">9.1× less than LanguageTool</tspan></text>
<rect x="272" y="304" width="73.0" height="16" rx="2" fill="#2a9d8f"/>
<text x="351.0" y="316.5" font-size="12" font-weight="600" fill="#1d1d1b">3.5 s</text>
<rect x="272" y="324" width="378.0" height="16" rx="2" fill="#9a9893"/>
<text x="656.0" y="336.5" font-size="12" font-weight="600" fill="#1d1d1b">18 s</text>
<text x="258" y="396" font-size="14" font-weight="600" fill="#1d1d1b" text-anchor="end">CPU time per check</text>
<rect x="272" y="374" width="27.8" height="16" rx="2" fill="#1e6fd9"/>
<text x="305.8" y="386.5" font-size="12" font-weight="600" fill="#1d1d1b">48 ms <tspan font-weight="400" fill="#6b6a66">14× less than LanguageTool</tspan></text>
<rect x="272" y="394" width="107.3" height="16" rx="2" fill="#2a9d8f"/>
<text x="385.3" y="406.5" font-size="12" font-weight="600" fill="#1d1d1b">187 ms</text>
<rect x="272" y="414" width="378.0" height="16" rx="2" fill="#9a9893"/>
<text x="656.0" y="426.5" font-size="12" font-weight="600" fill="#1d1d1b">658 ms</text>
<text x="258" y="486" font-size="14" font-weight="600" fill="#1d1d1b" text-anchor="end">Size on disk</text>
<rect x="272" y="464" width="13.7" height="16" rx="2" fill="#1e6fd9"/>
<text x="291.7" y="476.5" font-size="12" font-weight="600" fill="#1d1d1b">14 MB <tspan font-weight="400" fill="#6b6a66">28× smaller than LanguageTool</tspan></text>
<rect x="272" y="484" width="16.2" height="16" rx="2" fill="#2a9d8f"/>
<text x="294.2" y="496.5" font-size="12" font-weight="600" fill="#1d1d1b">17 MB</text>
