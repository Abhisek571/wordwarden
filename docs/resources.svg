<svg xmlns="http://www.w3.org/2000/svg" width="800" height="634" viewBox="0 0 800 634" font-family="Segoe UI, system-ui, -apple-system, sans-serif" role="img" aria-label="Resource use chart">
<rect width="100%" height="100%" rx="8" fill="#fbfaf7"/>
<text x="24" y="38" font-size="20" font-weight="700" fill="#1d1d1b">Resource use</text>
<text x="24" y="60" font-size="13" fill="#6b6a66">The newest Wordwarden release against the newest LanguageTool server, on the same machine. Shorter is better.</text>
<line x1="24" y1="80" x2="776" y2="80" stroke="#e4e2dc"/>
<text x="258" y="126" font-size="14" font-weight="600" fill="#1d1d1b" text-anchor="end">Memory while checking, 1 tab</text>
<rect x="272" y="104" width="107.5" height="16" rx="2" fill="#1e6fd9"/>
<text x="385.5" y="116.5" font-size="12" font-weight="600" fill="#1d1d1b">232 MB</text>
<rect x="272" y="124" width="378.0" height="16" rx="2" fill="#9a9893"/>
<text x="656.0" y="136.5" font-size="12" font-weight="600" fill="#1d1d1b">816 MB</text>
<text x="258" y="192" font-size="14" font-weight="600" fill="#1d1d1b" text-anchor="end">Memory while checking, 3 tabs</text>
<rect x="272" y="170" width="122.9" height="16" rx="2" fill="#1e6fd9"/>
<text x="400.9" y="182.5" font-size="12" font-weight="600" fill="#1d1d1b">266 MB</text>
<rect x="272" y="190" width="378.0" height="16" rx="2" fill="#9a9893"/>
<text x="656.0" y="202.5" font-size="12" font-weight="600" fill="#1d1d1b">816 MB</text>
<text x="258" y="258" font-size="14" font-weight="600" fill="#1d1d1b" text-anchor="end">CPU time to start</text>
<rect x="272" y="236" width="66.4" height="16" rx="2" fill="#1e6fd9"/>
<text x="344.4" y="248.5" font-size="12" font-weight="600" fill="#1d1d1b">2.4 s</text>
<rect x="272" y="256" width="378.0" height="16" rx="2" fill="#9a9893"/>
<text x="656.0" y="268.5" font-size="12" font-weight="600" fill="#1d1d1b">14 s</text>
<text x="258" y="324" font-size="14" font-weight="600" fill="#1d1d1b" text-anchor="end">Time to check 492 words</text>
<rect x="272" y="302" width="247.8" height="16" rx="2" fill="#1e6fd9"/>
<text x="525.8" y="314.5" font-size="12" font-weight="600" fill="#1d1d1b">140 ms</text>
<rect x="272" y="322" width="378.0" height="16" rx="2" fill="#9a9893"/>
<text x="656.0" y="334.5" font-size="12" font-weight="600" fill="#1d1d1b">214 ms</text>
<text x="258" y="390" font-size="14" font-weight="600" fill="#1d1d1b" text-anchor="end">CPU time per check</text>
<rect x="272" y="368" width="135.5" height="16" rx="2" fill="#1e6fd9"/>
<text x="413.5" y="380.5" font-size="12" font-weight="600" fill="#1d1d1b">162 ms</text>
<rect x="272" y="388" width="378.0" height="16" rx="2" fill="#9a9893"/>
<text x="656.0" y="400.5" font-size="12" font-weight="600" fill="#1d1d1b">451 ms</text>
<text x="258" y="456" font-size="14" font-weight="600" fill="#1d1d1b" text-anchor="end">Size on disk</text>
<rect x="272" y="434" width="20.8" height="16" rx="2" fill="#1e6fd9"/>
<text x="298.8" y="446.5" font-size="12" font-weight="600" fill="#1d1d1b">21 MB</text>
<rect x="272" y="454" width="378.0" height="16" rx="2" fill="#9a9893"/>
<text x="656.0" y="466.5" font-size="12" font-weight="600" fill="#1d1d1b">386 MB + Java</text>
<rect x="272" y="504" width="12" height="12" rx="2" fill="#1e6fd9"/>
<text x="290" y="514" font-size="12.5" fill="#1d1d1b">Wordwarden</text>
<rect x="272" y="524" width="12" height="12" rx="2" fill="#9a9893"/>
<text x="290" y="534" font-size="12.5" fill="#1d1d1b">LanguageTool server</text>
<line x1="24" y1="568" x2="776" y2="568" stroke="#e4e2dc"/>
<text x="24" y="590" font-size="12" fill="#6b6a66">Measured on GitHub's Linux machine (2 cores). Memory is private memory; CPU time is summed over all cores. Check times are</text>
<text x="24" y="606" font-size="12" fill="#6b6a66">the median of 30 checks of the same text. LanguageTool also needs its own browser extension, which is not counted.</text>
<text x="24" y="622" font-size="12" fill="#6b6a66">Generated automatically for every release except small bug fixes.</text>
</svg>
