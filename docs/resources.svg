<text x="341.6" y="566.5" font-size="12" font-weight="600" fill="#1d1d1b">37 ms <tspan font-weight="400" fill="#6b6a66">5.9× faster than LanguageTool</tspan></text>
<rect x="272" y="574" width="279.2" height="16" rx="2" fill="#2a9d8f"/>
<text x="557.2" y="586.5" font-size="12" font-weight="600" fill="#1d1d1b">163 ms</text>
<rect x="272" y="594" width="378.0" height="16" rx="2" fill="#9a9893"/>
<text x="656.0" y="606.5" font-size="12" font-weight="600" fill="#1d1d1b">221 ms</text>
<rect x="272" y="648" width="12" height="12" rx="2" fill="#1e6fd9"/>
<text x="290" y="658" font-size="12.5" fill="#1d1d1b">Wordwarden</text>
<rect x="272" y="668" width="12" height="12" rx="2" fill="#2a9d8f"/>
<text x="290" y="678" font-size="12.5" fill="#1d1d1b">Harper 2.12.0 extension</text>
<rect x="272" y="688" width="12" height="12" rx="2" fill="#9a9893"/>
<text x="290" y="698" font-size="12.5" fill="#1d1d1b">LanguageTool 6.6 server</text>
<line x1="24" y1="732" x2="776" y2="732" stroke="#e4e2dc"/>
<text x="24" y="754" font-size="12" fill="#6b6a66">Measured on GitHub's Linux machine (4 cores). Memory is private memory: for an extension, what it adds to the browser. CPU time is summed</text>
<text x="24" y="770" font-size="12" fill="#6b6a66">over all cores. Check times are the median of 30 checks of new text. LanguageTool's own browser extension is not counted.</text>
<text x="24" y="786" font-size="12" fill="#6b6a66">Generated automatically for every release except small bug fixes.</text>
</svg>
