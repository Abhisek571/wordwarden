<text x="350.2" y="566.5" font-size="12" font-weight="600" fill="#1d1d1b">40 ms <tspan font-weight="400" fill="#6b6a66">5.2× faster than LanguageTool</tspan></text>
<rect x="272" y="574" width="307.8" height="16" rx="2" fill="#2a9d8f"/>
<text x="585.8" y="586.5" font-size="12" font-weight="600" fill="#1d1d1b">168 ms</text>
<rect x="272" y="594" width="378.0" height="16" rx="2" fill="#9a9893"/>
<text x="656.0" y="606.5" font-size="12" font-weight="600" fill="#1d1d1b">207 ms</text>
