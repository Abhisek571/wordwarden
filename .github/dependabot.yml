# Monthly update pull requests. Minor and patch updates come together in one pull request; each major
# version and every harper.js update come on their own. harper.js is the checking engine, so its updates
# change the accuracy numbers: run the Accuracy workflow on its branch before merging.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      packages:
        patterns: ['*']
        update-types: [minor, patch]
        exclude-patterns: [harper.js]
    open-pull-requests-limit: 10
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
