# Monthly update pull requests. Minor and patch updates come together in one pull request; each major
# version comes on its own. harper.js is left out: the extension ships a patched Harper engine built for
# one harper.js version, so updating it means rebuilding that engine (see vendor/harper/README.md).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      packages:
        patterns: ['*']
        update-types: [minor, patch]
        exclude-patterns: [harper.js]
    ignore:
      - dependency-name: harper.js
    open-pull-requests-limit: 10
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
