name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # The lock file is written by npm 12; older npm versions reject it.
      - run: npm install -g npm@12.0.2
      - run: npm ci
      - run: npm run compile
      - run: npm test
      - run: npm run build
      - run: npm run build:firefox
      - run: npm run lint:firefox
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
