name: Accuracy

# Runs the real-world benchmarks and redraws docs/accuracy.svg. The datasets are downloaded from
# their original sites on each run and are never committed (see docs/BENCHMARKS.md for licences).
# Runs for every Wordwarden release (each v* tag), or by hand. New Harper or LanguageTool releases do not start it.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to measure and save the chart to
        default: main

permissions:
  contents: write

jobs:
  accuracy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # A tag measures the release it names; the chart is then saved to main, so the README shows it. A manual
      # run can name another branch to measure that branch before it is merged.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_type == 'tag' && github.ref || inputs.branch || 'main' }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # The lock file is written by npm 12; older npm versions reject it.
      - run: npm install -g npm@12.0.2
      - run: npm ci
      # Generates .wxt/tsconfig.json, which tsconfig.json extends; the benchmark test needs it.
      - run: npx wxt prepare
      - name: Download datasets
        run: |
          dir="$RUNNER_TEMP/benchmarks"
          mkdir -p "$dir/birkbeck" "$dir/jfleg" "$dir/lexnorm" "$dir/aalto"
          for file in missp.dat wikipedia.dat holbrook-tagged.dat; do
            curl -fsSL "https://www.dcs.bbk.ac.uk/~ROGER/$file" -o "$dir/birkbeck/$file"
          done
          for split in dev test; do
            for part in src ref0 ref1 ref2 ref3; do
              curl -fsSL "https://raw.githubusercontent.com/keisks/jfleg/master/$split/$split.$part" -o "$dir/jfleg/$split.$part"
            done
          done
          for file in train dev test; do
            curl -fsSL "https://huggingface.co/datasets/larrylawl/multilexnorm/resolve/main/data/en/$file.norm" -o "$dir/lexnorm/$file.norm"
          done
      # The Aalto keystrokes zip is 1.57 GB, so only the small fixed sample taken from it is kept, in the
      # workflow cache (never committed). It is downloaded again only when the cache is gone.
      - name: Restore the Aalto sample
        id: aalto
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/benchmarks/aalto/sample.tsv
          key: aalto-sample-${{ hashFiles('scripts/aalto-sample.mjs') }}
      - name: Make the Aalto sample
        if: steps.aalto.outputs.cache-hit != 'true'
        run: |
          curl -fsSL "https://userinterfaces.aalto.fi/136Mkeystrokes/data/Keystrokes.zip" -o "$RUNNER_TEMP/Keystrokes.zip"
          node scripts/aalto-sample.mjs "$RUNNER_TEMP/Keystrokes.zip" "$RUNNER_TEMP/benchmarks/aalto/sample.tsv"
          rm "$RUNNER_TEMP/Keystrokes.zip"
      # LanguageTool, for the comparison in the chart: always the latest release, read from its download page.
      # The benchmark starts it as a local server for the run and stops it afterwards. GitHub's Linux machines
      # include Java. The download is cached until a newer release appears.
      - name: Find the latest LanguageTool
        id: latest
        run: |
          version=$(curl -fsSL https://languagetool.org/download/ | grep -oE 'LanguageTool-[0-9]+\.[0-9]+(\.[0-9]+)?\.zip' | sed -E 's/LanguageTool-(.*)\.zip/\1/' | sort -uV | tail -1)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Restore LanguageTool
        id: languagetool
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/benchmarks/languagetool
          key: languagetool-${{ steps.latest.outputs.version }}
      - name: Download LanguageTool
        if: steps.languagetool.outputs.cache-hit != 'true'
        run: |
          curl -fsSL "https://languagetool.org/download/LanguageTool-${{ steps.latest.outputs.version }}.zip" -o "$RUNNER_TEMP/languagetool.zip"
          unzip -q "$RUNNER_TEMP/languagetool.zip" -d "$RUNNER_TEMP/benchmarks/languagetool"
          rm "$RUNNER_TEMP/languagetool.zip"
      # Harper, for the comparison: the browser extension from its newest GitHub release, whose engine file the
      # benchmark runs through harper.js. The engine only loads with the harper.js of the same version, so that one is
      # installed for the run when npm has it.
      - name: Download the latest Harper
        run: |
          curl -fsSL "https://github.com/Automattic/harper/releases/latest/download/harper-chrome-plugin.zip" -o "$RUNNER_TEMP/harper.zip"
          unzip -q "$RUNNER_TEMP/harper.zip" -d "$RUNNER_TEMP/benchmarks/harper"
          rm "$RUNNER_TEMP/harper.zip"
          version=$(node -p "require('$RUNNER_TEMP/benchmarks/harper/manifest.json').version")
          if npm view "harper.js@$version" version > /dev/null 2>&1; then npm install --no-save "harper.js@$version"; fi
      - name: Run benchmarks
        run: npm run evaluate:benchmarks
        env:
          WORDWARDEN_BENCHMARK_DIR: ${{ runner.temp }}/benchmarks
          WORDWARDEN_BENCHMARK_REPORT: ${{ runner.temp }}/report.json
      - run: node scripts/accuracy-chart.mjs "$RUNNER_TEMP/report.json"
      - run: node scripts/accuracy-history.mjs "$RUNNER_TEMP/report.json"
      # The numbers the website shows.
      - run: node scripts/website-numbers.mjs accuracy "$RUNNER_TEMP/report.json"
      - uses: actions/upload-artifact@v7
        with:
          name: benchmark-report
          path: ${{ runner.temp }}/report.json
          retention-days: 30
      # The Resources workflow may push its chart at the same time, so take its commit first.
      - name: Commit the updated charts
        run: |
          files="docs/accuracy.svg docs/accuracy-history.svg docs/accuracy-history.json docs/accuracy-latest.json"
          git diff --quiet $files && exit 0
          # A tag was checked out: carry the new charts over to the branch they are saved on.
          if ! git symbolic-ref -q HEAD > /dev/null; then
            branch="${{ inputs.branch || 'main' }}"
            mkdir -p "$RUNNER_TEMP/charts" && cp --parents $files "$RUNNER_TEMP/charts"
            git fetch --depth 1 origin "$branch" && git checkout -B "$branch" FETCH_HEAD
            cp -r "$RUNNER_TEMP/charts/docs" .
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $files
          git commit -m "Update accuracy charts"
          git pull --rebase origin "$(git branch --show-current)"
          git push origin HEAD
