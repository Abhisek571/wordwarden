name: Resources

# Measures the memory and CPU of the built extension against the newest Harper extension and LanguageTool server,
# and redraws docs/resources.svg. Runs for every Wordwarden release (each v* tag), or by hand.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resources:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # A tag measures the release it names; the chart is then saved to main, so the README shows it.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_type == 'tag' && github.ref || 'main' }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # The lock file is written by npm 12; older npm versions reject it.
      - run: npm install -g npm@12.0.2
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      # Always the latest LanguageTool release, read from its download page; cached until a newer one appears.
      # GitHub's Linux machines include Java.
      - name: Find the latest LanguageTool
        id: latest
        run: |
          version=$(curl -fsSL https://languagetool.org/download/ | grep -oE 'LanguageTool-[0-9]+\.[0-9]+(\.[0-9]+)?\.zip' | sed -E 's/LanguageTool-(.*)\.zip/\1/' | sort -uV | tail -1)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Restore LanguageTool
        id: languagetool
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/benchmarks/languagetool
          key: languagetool-${{ steps.latest.outputs.version }}
      - name: Download LanguageTool
        if: steps.languagetool.outputs.cache-hit != 'true'
        run: |
          curl -fsSL "https://languagetool.org/download/LanguageTool-${{ steps.latest.outputs.version }}.zip" -o "$RUNNER_TEMP/languagetool.zip"
          unzip -q "$RUNNER_TEMP/languagetool.zip" -d "$RUNNER_TEMP/benchmarks/languagetool"
          rm "$RUNNER_TEMP/languagetool.zip"
      # Harper's browser extension from its newest GitHub release, measured the same way as Wordwarden.
      - name: Download the latest Harper
        run: |
          curl -fsSL "https://github.com/Automattic/harper/releases/latest/download/harper-chrome-plugin.zip" -o "$RUNNER_TEMP/harper.zip"
          unzip -q "$RUNNER_TEMP/harper.zip" -d "$RUNNER_TEMP/harper"
          rm "$RUNNER_TEMP/harper.zip"
      - name: Measure resource use
        run: node scripts/resource-chart.mjs "$RUNNER_TEMP/benchmarks/languagetool" "$RUNNER_TEMP/resources.json"
        env:
          WORDWARDEN_HARPER_EXTENSION: ${{ runner.temp }}/harper
      # The numbers the website shows.
      - run: node scripts/website-numbers.mjs resources "$RUNNER_TEMP/resources.json"
      - uses: actions/upload-artifact@v7
        with:
          name: resource-report
          path: ${{ runner.temp }}/resources.json
          retention-days: 30
      # The Accuracy workflow may push its chart at the same time, so take its commit first.
      - name: Commit the updated chart
        run: |
          files="docs/resources.svg docs/resources-latest.json"
          git diff --quiet $files && exit 0
          # A tag was checked out: carry the new chart over to main.
          if ! git symbolic-ref -q HEAD > /dev/null; then
            mkdir -p "$RUNNER_TEMP/charts" && cp --parents $files "$RUNNER_TEMP/charts"
            git fetch --depth 1 origin main && git checkout -B main FETCH_HEAD
            cp -r "$RUNNER_TEMP/charts/docs" .
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $files
          git commit -m "Update resource chart"
          git pull --rebase origin main
          git push origin HEAD:main
