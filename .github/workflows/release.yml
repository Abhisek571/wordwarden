name: Release

# Push a version tag (for example v0.1.0) to build the store packages and attach them to a release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  libreoffice:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # The lock file is written by npm 12; older npm versions reject it.
      - run: npm install -g npm@12.0.2
      - run: npm ci
      # The add-on runs the extension's engine with Node's official programs, from the newest Node 24 release.
      - name: Download Node
        run: |
          version=$(curl -fsSL https://nodejs.org/dist/index.json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).find(r=>r.version.startsWith('v24.')).version))")
          echo "Node $version"
          base="https://nodejs.org/dist/$version"
          mkdir -p node/windows-x86_64 node/linux-x86_64 node/macos-x86_64 node/macos-aarch64 unpack
          curl -fsSL "$base/node-$version-win-x64.zip" -o unpack/win.zip
          unzip -q unpack/win.zip -d unpack
          mv "unpack/node-$version-win-x64/node.exe" node/windows-x86_64/
          mv "unpack/node-$version-win-x64/LICENSE" node/LICENSE
          curl -fsSL "$base/node-$version-linux-x64.tar.xz" | tar -xJ -C unpack
          mv "unpack/node-$version-linux-x64/bin/node" node/linux-x86_64/
          curl -fsSL "$base/node-$version-darwin-x64.tar.gz" | tar -xz -C unpack
          mv "unpack/node-$version-darwin-x64/bin/node" node/macos-x86_64/
          curl -fsSL "$base/node-$version-darwin-arm64.tar.gz" | tar -xz -C unpack
          mv "unpack/node-$version-darwin-arm64/bin/node" node/macos-aarch64/
      - name: Build the add-ons
        run: node scripts/build-libreoffice.mjs node windows linux macos
      - name: Install LibreOffice
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libreoffice-writer python3-uno
      - name: Check the add-on in LibreOffice
        run: python3 tests/libreoffice/check_addon.py /usr/lib/libreoffice/program .output/*-libreoffice-linux.oxt
      - uses: actions/upload-artifact@v4
        with:
          name: libreoffice
          path: .output/*.oxt
          if-no-files-found: error

  release:
    needs: libreoffice
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # The lock file is written by npm 12; older npm versions reject it.
      - run: npm install -g npm@12.0.2
      - run: npm ci
      - run: npm run compile
      - run: npm test
      - run: npm run zip
      - run: npm run zip:firefox
      - uses: actions/download-artifact@v4
        with:
          name: libreoffice
          path: .output
      - name: Create the release
        run: gh release create "$GITHUB_REF_NAME" .output/*.zip .output/*.oxt --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
