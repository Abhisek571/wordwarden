name: Website

# Publishes website/ to GitHub Pages with the current release notes and benchmark numbers. Runs when the
# changelog, the numbers or the page change on main, and after the Accuracy and Resources workflows,
# whose commits do not start other workflows on their own.
on:
  push:
    branches: [main]
    paths:
      - CHANGELOG.md
      - docs/accuracy-history.json
      - docs/accuracy-latest.json
      - docs/resources-latest.json
      - website/**
      - scripts/build-website.mjs
  workflow_run:
    workflows: [Accuracy, Resources]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website
  cancel-in-progress: true

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Plain Node scripts only; no packages are installed.
      - run: node scripts/build-website.mjs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/
      - id: deploy
        uses: actions/deploy-pages@v5
