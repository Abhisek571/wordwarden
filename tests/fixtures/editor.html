<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>Wordwarden fixture</title></head>
  <body>
    <label>Textarea<textarea id="editor">This are a test.</textarea></label>
    <!-- ?autofocus fills and focuses the textarea while the page loads, before the extension starts. -->
    <script>
      if (location.search === '?autofocus') {
        const textarea = document.getElementById('editor');
        textarea.value = 'This has a wrogn word.';
        textarea.focus();
      }
    </script>
    <label>Private<input id="private" type="password" value="secret"></label>
    <div id="rich" contenteditable="true">We was ready.</div>
    <div id="rich-blocks" contenteditable="true"><div>First line here.</div><div>Second wrods here.</div></div>
    <!-- Behaves like Reddit's editor: it keeps its own copy of the text and selection, redraws the field from that
         copy after every input, and only updates its selection when the browser reports a change, which happens
         a moment after the selection moves. -->
    <div id="lagging" contenteditable="true">Some cloud features. which i find annoying.</div>
    <script>
      const lagging = document.getElementById('lagging');
      let model = lagging.textContent;
      let known = { start: model.length, end: model.length };
      document.addEventListener('selectionchange', () => {
        const selection = document.getSelection();
        if (selection.rangeCount === 0 || !lagging.contains(selection.anchorNode)) return;
        const range = selection.getRangeAt(0);
        known = { start: range.startOffset, end: range.endOffset };
      });
      lagging.addEventListener('input', (event) => {
        if (event.inputType !== 'insertText') { model = lagging.textContent; return; }
        model = model.slice(0, known.start) + event.data + model.slice(known.end);
        const caret = known.start + event.data.length;
        lagging.textContent = model;
        document.getSelection().collapse(lagging.firstChild, caret);
        known = { start: caret, end: caret };
      });
    </script>
    <!-- Behaves like Twitch's chat box: when it gets focus back, it puts the cursor back where it was before. -->
    <div id="restoring" contenteditable="true">Say hi sda</div>
    <script>
      const restoring = document.getElementById('restoring');
      let saved = null;
      restoring.addEventListener('blur', () => {
        const selection = document.getSelection();
        saved = selection.rangeCount > 0 ? selection.getRangeAt(0).cloneRange() : null;
      });
      restoring.addEventListener('focus', () => {
        // Twitch does this when it redraws, a moment after the focus event.
        queueMicrotask(() => {
          if (saved === null) return;
          const selection = document.getSelection();
          selection.removeAllRanges();
          selection.addRange(saved);
        });
      });
    </script>
    <!-- Behaves like Twitch's chat box: it draws each change a moment after it happens, not straight away. -->
    <div id="delayed" contenteditable="true">Say hi sda</div>
    <script>
      const delayed = document.getElementById('delayed');
      let drawn = delayed.textContent;
      delayed.addEventListener('input', () => {
        const typed = delayed.textContent;
        delayed.textContent = drawn;
        setTimeout(() => {
          drawn = typed;
          delayed.textContent = typed;
          document.getSelection().collapse(delayed.firstChild, typed.length);
        }, 30);
      });
    </script>
  </body>
</html>
