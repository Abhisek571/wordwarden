[package]
name = "wordwarden-pos-utils"
version = "0.1.0"
edition = "2024"
description = "Part-of-speech tagging and chunking for Wordwarden core."
license = "Apache-2.0"
repository = "https://github.com/Abhisek571/wordwarden"
publish = false

[dependencies]
rs-conllu = "0.3.0"
hashbrown = { version = "0.16.1", features = ["serde"] }
strum = "0.28.0"
strum_macros = "0.28.0"
serde = { version = "1.0.228", features = ["derive"] }
is-macro = "0.3.7"
rand = { version = "0.10.1", optional = true }
serde_json = "1.0.150"
lru = "0.18.0"
rayon = { version = "1.12.0", optional = true }

[features]
default = []
training = ["dep:rand"]
threaded = ["dep:rayon"]
